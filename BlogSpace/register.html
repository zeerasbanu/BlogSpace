<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account | BlogSpace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>

<body class="auth-page">
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <span class="brand-mark">B</span> BlogSpace
      </a>
      <a class="text-link" href="index.html">← Back to home</a>
    </div>
  </header>

  <main class="auth-layout">
    <section class="auth-image register-image" aria-label="Welcome section">
      <div class="auth-image-copy">
        <span class="auth-quote-mark">✳</span>
        <h2>Every great story<br />starts somewhere.</h2>
        <p>Start with a blank page. See where it takes you.</p>
      </div>
    </section>

    <section class="auth-form-side">
      <div class="auth-form-box">
        <p class="eyebrow">JOIN THE COMMUNITY</p>
        <h1>Create your account<span class="heading-dot">.</span></h1>
        <p class="form-lead">It only takes a minute to get started.</p>

        <div class="form-message" id="registerMessage" role="alert" aria-live="polite"></div>

        <form id="registerForm" novalidate>
          <label for="fullName">Full name</label>
          <input id="fullName" name="name" type="text" placeholder="Your name" minlength="2" autocomplete="name"
            required />

          <label for="registerEmail">Email address</label>
          <input id="registerEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email"
            required />

          <label for="registerPassword">Password</label>
          <input id="registerPassword" name="password" type="password" placeholder="At least 6 characters" minlength="6"
            autocomplete="new-password" required />

          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Enter password again"
            autocomplete="new-password" required />

          <button class="button form-submit" type="submit">
            Create account <span>↗</span>
          </button>
        </form>

        <p class="auth-switch">
          Already have an account?
          <a href="login.html">Log in</a>
        </p>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
