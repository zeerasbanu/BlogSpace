<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | BlogSpace</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>

  <body class="auth-page">
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="index.html">
          <span class="brand-mark">B</span> BlogSpace
        </a>
        <a class="text-link" href="index.html">← Back to home</a>
      </div>
    </header>

    <main class="auth-layout">
      <section class="auth-image login-image" aria-label="Welcome section">
        <div class="auth-image-copy">
          <span class="auth-quote-mark">“</span>
          <h2>Good ideas are<br />better when shared.</h2>
          <p>Find your people. Share what you know.</p>
        </div>
      </section>

      <section class="auth-form-side">
        <div class="auth-form-box">
          <p class="eyebrow">WELCOME BACK</p>
          <h1>Log in to BlogSpace<span class="heading-dot">.</span></h1>
          <p class="form-lead">Pick up where you left off.</p>

          <div class="form-message" id="loginMessage" role="alert" aria-live="polite"></div>

          <form id="loginForm">
            <label for="loginEmail">Email address</label>
            <input
              id="loginEmail"
              name="email"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />

            <div class="label-row">
              <label for="loginPassword">Password</label>
              <a href="#" class="small-link" id="toggleLoginPassword">Show password</a>
            </div>
            <input
              id="loginPassword"
              name="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />

            <button class="button form-submit" type="submit">
              Log in <span>↗</span>
            </button>
          </form>

          <p class="auth-switch">
            New to BlogSpace?
            <a href="register.html">Create an account</a>
          </p>

          <p class="demo-hint">Demo tip: create an account on the register page first.</p>
        </div>
      </section>
    </main>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
